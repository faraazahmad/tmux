# ─── Prefix ───────────────────────────────────────────────────────────────
# Replace ctrl-b with ctrl-a (zellij uses Ctrl-* prefixes for modes)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ─── General ──────────────────────────────────────────────────────────────
set -g mouse on
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 10000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ─── Splits (mirrors zellij pane "n"/"r" + "d") ───────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation without prefix (zellij Alt+hjkl/arrows) ──────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ─── Window (zellij "tab") navigation ─────────────────────────────────────
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-i swap-window -t -1\; select-window -t -1   # MoveTab left
bind -n M-o swap-window -t +1\; select-window -t +1   # MoveTab right

# ─── Resize (zellij resize mode H/J/K/L) ──────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Pane management ──────────────────────────────────────────────────────
bind x kill-pane                         # zellij: x closes pane
bind f resize-pane -Z                    # zellij pane "f": fullscreen toggle
bind z set -g status                     # toggle frames/status

# ─── Sessions / detach (zellij Ctrl-q quit, "d" detach) ───────────────────
bind -n C-q kill-session
bind d detach-client

# ─── Copy mode (vi keys, zellij scroll mode feel) ─────────────────────────
setw -g mode-keys vi
bind -n C-s copy-mode                    # zellij Ctrl-s -> scroll mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ─── Reload config ────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ─── Theme: Gruvbox Dark (sourced from tmux-gruvbox-truecolor) ────────────
# Repo: https://github.com/LawAbidingCactus/tmux-gruvbox-truecolor
# Cloned to ~/.tmux-themes/tmux-gruvbox-truecolor
source-file ~/.tmux-themes/tmux-gruvbox-truecolor/tmux-colorscheme.conf
